<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 820" width="100%" height="100%" role="img" aria-labelledby="midTitle midDesc">
  <title id="midTitle">Sơ đồ y khoa: Sâu răng và Bảo tồn tủy theo triết lý MID</title>
  <desc id="midDesc">So sánh trực quan giữa phương pháp trám bảo tồn mô răng thật và tủy sống theo triết lý can thiệp tối thiểu MID (Nên làm) với việc mài răng quá mức và lấy tủy sớm (Nên tránh).</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06212E"/>
      <stop offset="100%" stop-color="#0A3542"/>
    </linearGradient>
    <style>
      .f-sans { font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif; }
      .f-serif { font-family: 'Lora', Georgia, 'Times New Roman', serif; }
    </style>
  </defs>

  <!-- Nền xanh Navy đậm độ tương phản cực cao -->
  <rect width="1200" height="820" rx="24" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="1184" height="804" rx="20" fill="none" stroke="#FFD54F" stroke-width="2" stroke-opacity="0.45"/>

  <!-- Phần Tiêu đề chính -->
  <rect x="370" y="22" width="460" height="34" rx="17" fill="#10495B" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="600" y="45" text-anchor="middle" class="f-sans" font-size="16" font-weight="800" fill="#FFD54F" letter-spacing="1.5">SƠ ĐỒ Y KHOA · NHA KHOA BẢO TỒN (MID)</text>

  <text x="600" y="92" text-anchor="middle" class="f-serif" font-size="36" font-weight="700" fill="#FFFFFF">SÂU RĂNG &amp; BẢO TỒN TỦY THEO TRIẾT LÝ MID</text>
  <text x="600" y="126" text-anchor="middle" class="f-sans" font-size="21" font-weight="700" fill="#FFD54F">Can thiệp tối thiểu — Giữ tối đa mô răng thật và nguồn sống của tủy răng</text>

  <!-- ================= CỘT TRÁI: NÊN LÀM (BẢO TỒN MÔ THẬT) ================= -->
  <g transform="translate(32, 148)">
    <!-- Khung cột trái -->
    <rect width="552" height="596" rx="20" fill="#082A36" stroke="#2EE59D" stroke-width="3.5"/>

    <!-- Thanh tiêu đề NÊN LÀM -->
    <rect x="0" y="0" width="552" height="66" rx="20" fill="#0D5C46"/>
    <rect x="0" y="40" width="552" height="26" fill="#0D5C46"/>
    <circle cx="44" cy="33" r="20" fill="#2EE59D"/>
    <path d="M35 33 L42 40 L54 26" fill="none" stroke="#06212E" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="76" y="42" class="f-sans" font-size="25" font-weight="900" fill="#FFFFFF">NÊN LÀM: TRÁM BẢO TỒN MÔ THẬT</text>

    <!-- Minh họa mặt cắt răng bảo tồn -->
    <!-- Mô nướu lành mạnh -->
    <path d="M58 245 Q115 225 145 248 L295 248 Q325 225 382 245 L382 375 Q220 390 58 375 Z" fill="#D96B70" fill-opacity="0.35" stroke="#F48FB1" stroke-width="2"/>

    <!-- Thân răng & Chân răng nguyên vẹn (Men răng trắng sáng) -->
    <path d="M125 145
             C125 110, 165 102, 195 118
             C212 127, 228 127, 245 118
             C275 102, 315 110, 315 145
             C315 182, 302 215, 295 245
             L285 352
             C282 372, 262 372, 255 348
             L238 282
             C230 262, 210 262, 202 282
             L185 348
             C178 372, 158 372, 155 352
             L145 245
             C138 215, 125 182, 125 145 Z"
          fill="#FFFFFF" stroke="#B2EBF2" stroke-width="3.5"/>

    <!-- Lớp Ngà răng bảo tồn rộng rãi -->
    <path d="M143 158
             C143 132, 172 126, 196 138
             C212 146, 228 146, 244 138
             C268 126, 297 132, 297 158
             C297 188, 287 215, 282 242
             L274 342
             C272 354, 264 354, 260 340
             L242 274
             C232 250, 208 250, 198 274
             L180 340
             C176 354, 168 354, 166 342
             L158 242
             C153 215, 143 188, 143 158 Z"
          fill="#FFF3C4" stroke="#E6C665" stroke-width="2"/>

    <!-- Miếng trám sinh học nhỏ gọn (MID) ở rãnh mặt nhai -->
    <path d="M186 114
             Q220 132 254 114
             Q248 152 220 154
             Q192 152 186 114 Z"
          fill="#2EE59D" stroke="#06212E" stroke-width="2.5"/>

    <!-- Lớp ngà phản ứng bảo vệ trần tủy -->
    <path d="M192 162 Q220 172 248 162" fill="none" stroke="#00BFA5" stroke-width="5" stroke-linecap="round"/>

    <!-- Buồng tủy & Ống tủy SỐNG khỏe mạnh (Đỏ tươi) -->
    <path d="M182 190
             C182 176, 202 174, 220 178
             C238 174, 258 176, 258 190
             L254 238
             L268 335
             C266 342, 262 342, 258 332
             L236 254
             C226 240, 214 240, 204 254
             L182 332
             C178 342, 174 342, 172 335
             L186 238 Z"
          fill="#FF3B4E" stroke="#B71C1C" stroke-width="2"/>

    <!-- Đường chỉ dẫn & Nhãn chữ to, tương phản cao -->
    <!-- Nhãn 1: Miếng trám -->
    <line x1="238" y1="132" x2="342" y2="112" stroke="#FFD54F" stroke-width="3"/>
    <circle cx="238" cy="132" r="5" fill="#FFD54F"/>
    <rect x="342" y="84" width="194" height="58" rx="10" fill="#0E3E4F" stroke="#FFD54F" stroke-width="2"/>
    <text x="354" y="109" class="f-sans" font-size="18" font-weight="800" fill="#FFD54F">Trám nhỏ vừa vặn</text>
    <text x="354" y="132" class="f-sans" font-size="16" font-weight="700" fill="#FFFFFF">Chỉ lấy mô sâu hỏng</text>

    <!-- Nhãn 2: Mô răng lành -->
    <line x1="292" y1="190" x2="342" y2="190" stroke="#FFFFFF" stroke-width="3"/>
    <circle cx="292" cy="190" r="5" fill="#FFFFFF"/>
    <rect x="342" y="160" width="194" height="60" rx="10" fill="#0E3E4F" stroke="#2EE59D" stroke-width="2"/>
    <text x="354" y="186" class="f-sans" font-size="18" font-weight="800" fill="#2EE59D">Giữ 85–90% mô thật</text>
    <text x="354" y="209" class="f-sans" font-size="16" font-weight="700" fill="#FFFFFF">Thành răng dày, cứng chắc</text>

    <!-- Nhãn 3: Tủy răng sống -->
    <line x1="248" y1="222" x2="342" y2="268" stroke="#FF6B6B" stroke-width="3"/>
    <circle cx="248" cy="222" r="5" fill="#FFD54F"/>
    <rect x="342" y="238" width="194" height="64" rx="10" fill="#0E3E4F" stroke="#FFD54F" stroke-width="2"/>
    <text x="354" y="264" class="f-sans" font-size="18" font-weight="900" fill="#FFD54F">Tủy răng SỐNG khỏe</text>
    <text x="354" y="289" class="f-sans" font-size="16" font-weight="700" fill="#FFFFFF">Nuôi dưỡng răng lâu dài</text>

    <!-- Nhãn phụ dưới chân răng -->
    <rect x="78" y="384" width="284" height="36" rx="18" fill="#0D5C46" stroke="#2EE59D" stroke-width="1.5"/>
    <text x="220" y="408" text-anchor="middle" class="f-sans" font-size="18" font-weight="800" fill="#FFFFFF">RĂNG THẬT BỀN VỮNG TỰ NHIÊN</text>

    <!-- Hộp 3 lợi ích chữ cực to cho người lớn tuổi -->
    <rect x="20" y="434" width="512" height="144" rx="14" fill="#051B24" stroke="#2EE59D" stroke-width="1.5"/>
    <text x="38" y="468" class="f-sans" font-size="20" font-weight="800" fill="#FFD54F">✓ Giữ tối đa men và ngà răng lành tự nhiên</text>
    <text x="38" y="508" class="f-sans" font-size="20" font-weight="800" fill="#FFFFFF">✓ Bảo tồn tủy sống — răng dẻo dai, ăn nhai thật</text>
    <text x="38" y="548" class="f-sans" font-size="20" font-weight="800" fill="#2EE59D">✓ Ít ê buốt, tiết kiệm chi phí, bền hàng chục năm</text>
  </g>

  <!-- ================= CỘT PHẢI: NÊN TRÁNH (MÀI QUÁ MỨC & LẤY TỦY) ================= -->
  <g transform="translate(616, 148)">
    <!-- Khung cột phải -->
    <rect width="552" height="596" rx="20" fill="#082A36" stroke="#FF6B6B" stroke-width="3.5"/>

    <!-- Thanh tiêu đề NÊN TRÁNH -->
    <rect x="0" y="0" width="552" height="66" rx="20" fill="#7A1C24"/>
    <rect x="0" y="40" width="552" height="26" fill="#7A1C24"/>
    <circle cx="44" cy="33" r="20" fill="#FFD54F"/>
    <path d="M35 24 L53 42 M53 24 L35 42" fill="none" stroke="#7A1C24" stroke-width="4.5" stroke-linecap="round"/>
    <text x="76" y="42" class="f-sans" font-size="25" font-weight="900" fill="#FFD54F">NÊN TRÁNH: MÀI QUÁ MỨC &amp; LẤY TỦY</text>

    <!-- Minh họa mặt cắt răng bị mài quá mức -->
    <!-- Mô nướu -->
    <path d="M58 245 Q115 225 145 248 L295 248 Q325 225 382 245 L382 375 Q220 390 58 375 Z" fill="#D96B70" fill-opacity="0.3" stroke="#E57373" stroke-width="2"/>

    <!-- Đường nét đứt thể hiện phần mô răng thật đã bị mài mất -->
    <path d="M125 145
             C125 110, 165 102, 195 118
             C212 127, 228 127, 245 118
             C275 102, 315 110, 315 145"
          fill="none" stroke="#FFD54F" stroke-width="2.5" stroke-dasharray="7,6"/>

    <!-- Phần răng còn lại mỏng yếu, xám khô do mất tủy -->
    <path d="M138 175
             L158 175
             L165 242
             L275 242
             L282 175
             L302 175
             C300 205, 298 225, 295 245
             L285 352
             C282 372, 262 372, 255 348
             L238 282
             C230 262, 210 262, 202 282
             L185 348
             C178 372, 158 372, 155 352
             L145 245
             C142 225, 140 205, 138 175 Z"
          fill="#CFD8DC" stroke="#90A4AE" stroke-width="3"/>

    <!-- Khối khoan mài rộng xâm lấn sâu vào buồng tủy -->
    <path d="M158 140 L282 140 L274 242 L166 242 Z" fill="#546E7A" stroke="#FF6B6B" stroke-width="2.5"/>

    <!-- Ống tủy đã bị lấy bỏ tủy sống (màu xám tối vô mạch) -->
    <path d="M184 240
             L256 240
             L268 335
             C266 342, 262 342, 258 332
             L236 254
             C226 240, 214 240, 204 254
             L182 332
             C178 342, 174 342, 172 335 Z"
          fill="#37474F" stroke="#78909C" stroke-width="2"/>

    <!-- Vết rạn nứt cảnh báo trên thành răng mỏng -->
    <path d="M142 205 L155 215 L146 228 L160 240" fill="none" stroke="#FF5252" stroke-width="3" stroke-linecap="round"/>
    <path d="M296 205 L283 216 L292 229 L278 240" fill="none" stroke="#FF5252" stroke-width="3" stroke-linecap="round"/>

    <!-- Đường chỉ dẫn & Nhãn chữ to, tương phản cao -->
    <!-- Nhãn 1: Mài mất mô răng -->
    <line x1="265" y1="120" x2="342" y2="112" stroke="#FFD54F" stroke-width="3"/>
    <circle cx="265" cy="120" r="5" fill="#FFD54F"/>
    <rect x="342" y="84" width="194" height="58" rx="10" fill="#3B1922" stroke="#FFD54F" stroke-width="2"/>
    <text x="354" y="109" class="f-sans" font-size="18" font-weight="800" fill="#FFD54F">Mài mất nhiều mô lành</text>
    <text x="354" y="132" class="f-sans" font-size="16" font-weight="700" fill="#FFFFFF">Không thể mọc lại được</text>

    <!-- Nhãn 2: Thành răng mỏng -->
    <line x1="292" y1="210" x2="342" y2="190" stroke="#FF6B6B" stroke-width="3"/>
    <circle cx="292" cy="210" r="5" fill="#FF6B6B"/>
    <rect x="342" y="160" width="194" height="60" rx="10" fill="#3B1922" stroke="#FF6B6B" stroke-width="2"/>
    <text x="354" y="186" class="f-sans" font-size="18" font-weight="800" fill="#FF8A80">Thành răng quá mỏng</text>
    <text x="354" y="209" class="f-sans" font-size="16" font-weight="700" fill="#FFFFFF">Nguy cơ nứt, tét chân răng</text>

    <!-- Nhãn 3: Tủy bị lấy bỏ -->
    <line x1="252" y1="275" x2="342" y2="268" stroke="#FFD54F" stroke-width="3"/>
    <circle cx="252" cy="275" r="5" fill="#FFD54F"/>
    <rect x="342" y="238" width="194" height="64" rx="10" fill="#3B1922" stroke="#FFD54F" stroke-width="2"/>
    <text x="354" y="264" class="f-sans" font-size="18" font-weight="900" fill="#FFD54F">Mất tủy nuôi dưỡng</text>
    <text x="354" y="289" class="f-sans" font-size="16" font-weight="700" fill="#FFFFFF">Răng khô, giòn, giảm tuổi thọ</text>

    <!-- Nhãn phụ dưới chân răng -->
    <rect x="78" y="384" width="284" height="36" rx="18" fill="#7A1C24" stroke="#FF6B6B" stroke-width="1.5"/>
    <text x="220" y="408" text-anchor="middle" class="f-sans" font-size="18" font-weight="800" fill="#FFD54F">RĂNG YẾU &amp; DỄ GÃY VỠ SỚM</text>

    <!-- Hộp 3 hệ lụy chữ cực to cho người lớn tuổi -->
    <rect x="20" y="434" width="512" height="144" rx="14" fill="#051B24" stroke="#FF6B6B" stroke-width="1.5"/>
    <text x="38" y="468" class="f-sans" font-size="20" font-weight="800" fill="#FFD54F">✕ Mài phạm nhiều men và ngà răng lành</text>
    <text x="38" y="508" class="f-sans" font-size="20" font-weight="800" fill="#FFFFFF">✕ Lấy tủy khi chưa bắt buộc làm răng khô giòn</text>
    <text x="38" y="548" class="f-sans" font-size="20" font-weight="800" fill="#FF8A80">✕ Tốn kém chi phí bọc mão, dễ nứt dọc chân răng</text>
  </g>

  <!-- Thanh ghi chú chuyên môn dưới cùng -->
  <rect x="32" y="758" width="1136" height="44" rx="12" fill="#0F3E4D" stroke="#FFD54F" stroke-width="1.5"/>
  <text x="600" y="786" text-anchor="middle" class="f-sans" font-size="19" font-weight="800" fill="#FFD54F">
    ✦ Nha khoa Gia đình BS Trịnh Công Vương — Ưu tiên bảo tồn mô răng thật &amp; tủy sống · ĐT/Zalo: 0912 343 858
  </text>
</svg>
