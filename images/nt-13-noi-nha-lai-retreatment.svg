<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#072731"/>
      <stop offset="100%" stop-color="#0d4a58"/>
    </linearGradient>
    <linearGradient id="tooth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7fbfc"/>
      <stop offset="100%" stop-color="#d7eaed"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <text x="60" y="72" fill="#e6f7f5" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">NT-13: NỘI NHA LẠI (RETREATMENT) — CỨU GIỮ RĂNG TÁI VIÊM</text>
  <text x="60" y="108" fill="#8fd3cc" font-family="Segoe UI, Arial, sans-serif" font-size="20">Tìm ống tủy sót (MB2) · Loại bỏ vật liệu cũ · Khử khuẩn &amp; Trám bít lại kín ba chiều</text>

  <!-- Left: Failed Root Canal -->
  <g transform="translate(110,155)">
    <rect width="420" height="430" rx="22" fill="#0b3643" stroke="#ff7b72" stroke-width="2.5"/>
    <text x="210" y="42" text-anchor="middle" fill="#ff9e96" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">TRƯỚC: THẤT BẠI NỘI NHA CŨ</text>
    <g transform="translate(105,65)">
      <path d="M105,10 C165,10 195,55 188,125 L162,275 C158,295 142,300 132,275 L112,185 L92,275 C82,300 66,295 62,275 L36,125 C29,55 59,10 105,10 Z" fill="url(#tooth)"/>
      <!-- Short obturation -->
      <path d="M72,90 L86,90 L82,200 L70,200 Z" fill="#ff758f"/>
      <!-- Missed Canal -->
      <path d="M126,90 L138,90 L152,278" stroke="#d94e4e" stroke-width="6" fill="none" stroke-dasharray="6 4"/>
      <!-- Periapical Lesion -->
      <circle cx="152" cy="296" r="34" fill="#e63946" opacity="0.7"/>
      <text x="152" y="348" text-anchor="middle" fill="#ffb3b8" font-family="Segoe UI, Arial, sans-serif" font-size="16">Sót ống tủy &amp; Viêm chóp</text>
    </g>
  </g>

  <!-- Arrow -->
  <path d="M555,370 L635,370" stroke="#ffd166" stroke-width="8" stroke-linecap="round"/>
  <polygon points="635,355 660,370 635,385" fill="#ffd166"/>

  <!-- Right: Successful Retreatment -->
  <g transform="translate(680,155)">
    <rect width="420" height="430" rx="22" fill="#0b3643" stroke="#06d6a0" stroke-width="2.5"/>
    <text x="210" y="42" text-anchor="middle" fill="#64dfdf" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">SAU: NỘI NHA LẠI CHUẨN MỰC</text>
    <g transform="translate(105,65)">
      <path d="M105,10 C165,10 195,55 188,125 L162,275 C158,295 142,300 132,275 L112,185 L92,275 C82,300 66,295 62,275 L36,125 C29,55 59,10 105,10 Z" fill="url(#tooth)"/>
      <!-- Coronal seal -->
      <rect x="65" y="20" width="80" height="68" rx="8" fill="#48cae4"/>
      <!-- Both Canals Full Length Bioceramic -->
      <path d="M72,88 L88,88 L76,274 L68,274 Z" fill="#06d6a0"/>
      <path d="M122,88 L138,88 L152,274 L144,274 Z" fill="#06d6a0"/>
      <!-- Healed Bone -->
      <circle cx="152" cy="296" r="34" fill="none" stroke="#06d6a0" stroke-width="3" stroke-dasharray="6 4"/>
      <text x="110" y="348" text-anchor="middle" fill="#a7f3d0" font-family="Segoe UI, Arial, sans-serif" font-size="16">Đủ ống tủy · Kín chóp · Lành xương</text>
    </g>
  </g>

  <text x="60" y="642" fill="#8fd3cc" font-family="Segoe UI, Arial, sans-serif" font-size="16">Phòng khám Nha khoa Gia đình — BS Trịnh Công Vương · Triết lý Nha khoa can thiệp tối thiểu (MID)</text>
</svg>
