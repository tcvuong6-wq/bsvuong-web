  <!-- Arrow -->
  <path d="M555,370 L635,370" stroke="#06d6a0" stroke-width="8" stroke-linecap="round"/>
  <polygon points="635,355 660,370 635,385" fill="#06d6a0"/>
  <text x="598" y="345" text-anchor="middle" fill="#64dfdf" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="700">6–12 tháng</text>

