  <g transform="translate(680,155)">
    <rect width="420" height="430" rx="22" fill="#0b3643" stroke="#06d6a0" stroke-width="2.5"/>
    <text x="210" y="42" text-anchor="middle" fill="#64dfdf" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">TÁI KHÁM: LÀNH XƯƠNG HOÀN TOÀN</text>
    <g transform="translate(105,65)">
