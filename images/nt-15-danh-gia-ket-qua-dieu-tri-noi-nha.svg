  <text x="60" y="108" fill="#8fd3cc" font-family="Segoe UI, Arial, sans-serif" font-size="20">Theo dõi định kỳ 1–4 năm (ESE) · Tái tạo xương quanh chóp · Tiêu chí thành công bền vững</text>

  <!-- Left: Day 0 -->
  <g transform="translate(110,155)">
